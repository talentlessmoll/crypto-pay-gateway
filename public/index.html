<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Payment Gateway Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; }
    .card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
    h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: #fff; }
    p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
    input, select { width: 100%; background: #0f172a; border: 1px solid var(--border); padding: 0.75rem; border-radius: 8px; color: #fff; font-size: 0.95rem; }
    .btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: var(--accent-hover); }
    .api-preview { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.8rem; overflow-x: auto; color: #38bdf8; display: none; margin-top: 1rem; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>⚡ Crypto Pay Gateway</h1>
      <p>Zero-KYC, non-custodial crypto checkout test dashboard.</p>

      <form id="create-invoice-form">
        <div class="form-group">
          <label>Amount to Charge (USD):</label>
          <input type="number" id="amount" value="5.00" step="0.50" min="0.50" required />
        </div>

        <div class="form-group">
          <label>Select Blockchain Network:</label>
          <select id="network">
            <option value="litecoin" selected>Litecoin (LTC) - Super Low Fee & Fast</option>
            <option value="polygon">Polygon (USDT)</option>
            <option value="bsc">Binance Smart Chain (USDT)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Your Internal Order ID:</label>
          <input type="text" id="orderId" value="ORDER-1001" />
        </div>

        <button type="submit" class="btn">Generate Checkout Link</button>
      </form>

      <div class="api-preview" id="preview-box"></div>
    </div>
  </div>

  <script>
    document.getElementById("create-invoice-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const amountUSD = document.getElementById("amount").value;
      const network = document.getElementById("network").value;
      const orderId = document.getElementById("orderId").value;
      const previewBox = document.getElementById("preview-box");

      try {
        const res = await fetch("/api/invoice", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amountUSD, network, orderId })
        });
        const data = await res.json();

        if (data.success) {
          previewBox.style.display = "block";
          previewBox.innerHTML = `<strong>Invoice Created!</strong><br><br>` +
            `Redirecting to Checkout:<br><a href="${data.checkoutUrl}" style="color: #6366f1;">${window.location.origin}${data.checkoutUrl}</a><br><br>` +
            `<pre>${JSON.stringify(data.invoice, null, 2)}</pre>`;
          
          setTimeout(() => {
            window.location.href = data.checkoutUrl;
          }, 1500);
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Failed to create invoice: " + err.message);
      }
    });
  </script>
</body>
</html>
